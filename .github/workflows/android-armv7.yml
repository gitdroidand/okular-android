name: Okular Android ARMv7 (armeabi-v7a)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: okular-android-armv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Okular APK (armeabi-v7a)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      IMAGE: invent-registry.kde.org/sysadmin/ci-images/android-qt611:latest
      BASE: /home/runner/okular-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h /

      - name: Prepare directories
        shell: bash
        run: |
          mkdir -p "$BASE/craft" "$BASE/out"
          chmod -R 777 "$BASE"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Pull KDE Android image
        run: docker pull "$IMAGE"

      - name: Write build script
        shell: bash
        run: |
          cat > "$BASE/build.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -eo pipefail

          export CRAFT_ROOT=/home/user/CraftRoot
          SRC=/home/user/okular-src
          OUT=/home/user/out

          trap 'mkdir -p "$OUT/logs"; find "$CRAFT_ROOT/build" -maxdepth 6 \( -name CMakeError.log -o -name CMakeOutput.log \) -exec cp --parents {} "$OUT/logs/" \; 2>/dev/null || true' EXIT

          git config --global --add safe.directory '*'

          echo "::group::Environment"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK=${ANDROID_NDK:-}"
          echo "ANDROID_BUILD_TOOLS_REVISION=${ANDROID_BUILD_TOOLS_REVISION:-}"
          python3 --version
          df -h /home/user
          echo "::endgroup::"

          echo "::group::Craft bootstrap"
          curl -fsSL https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py -o /tmp/CraftBootstrap.py
          python3 /tmp/CraftBootstrap.py --prefix "$CRAFT_ROOT" --use-defaults
          echo "::endgroup::"

          echo "::group::Craft settings (ARM32 + MinSizeRel)"
          python3 - <<'PY'
          import configparser, os
          p = os.path.join(os.environ["CRAFT_ROOT"], "etc", "CraftSettings.ini")
          c = configparser.ConfigParser(interpolation=None)
          c.optionxform = str
          c.read(p)
          for s in ("General", "Compile"):
              if not c.has_section(s):
                  c.add_section(s)
          c["General"]["ABI"] = "android-clang-arm32"
          c["Compile"]["BuildType"] = "MinSizeRel"
          with open(p, "w") as f:
              c.write(f)
          PY
          cat "$CRAFT_ROOT/etc/CraftSettings.ini"
          echo "::endgroup::"

          # craftenv.sh is not compatible with "set -u"
          source "$CRAFT_ROOT/craft/craftenv.sh"

          craft --version
          craft --search okular || true

          echo "::group::Build Okular"
          craft --options "okular.srcDir=$SRC" okular
          echo "::endgroup::"

          echo "::group::Package Okular"
          craft --options "okular.srcDir=$SRC" --package okular
          echo "::endgroup::"

          echo "::group::Locate APK"
          APK_IN="$(find "$CRAFT_ROOT" -type f -name '*.apk' -not -path '*/build/*' \
                    -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
          test -n "$APK_IN"
          echo "APK_IN=$APK_IN"
          unzip -l "$APK_IN" | grep 'lib/' | head -50 || true
          unzip -l "$APK_IN" | grep -q 'lib/armeabi-v7a/' \
            || { echo "::error::APK has no lib/armeabi-v7a/"; exit 1; }
          echo "::endgroup::"

          echo "::group::Align + sign"
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_REVISION:-none}"
          [ -x "$BT/zipalign" ] || BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"

          KS=/tmp/signing.keystore
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="${KS_PASS:?KS_PASS missing}"
            ALIAS="${KS_ALIAS:?KS_ALIAS missing}"
            echo "Using keystore from secrets"
          else
            PASS=123456
            ALIAS=mykey
            keytool -genkey -noprompt -keystore "$KS" -keypass "$PASS" \
              -dname "CN=None, OU=None, O=None, L=None, S=None, C=XY" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS"
            echo "Using a temporary debug keystore"
          fi

          "$BT/zipalign" -p -f -v 4 "$APK_IN" /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT/okular-armeabi-v7a.apk" /tmp/aligned.apk
          "$BT/apksigner" verify --verbose "$OUT/okular-armeabi-v7a.apk"
          ls -lah "$OUT"
          echo "::endgroup::"
          SCRIPT
          chmod +x "$BASE/build.sh"

      - name: Build, package and sign (Docker)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          docker run --rm \
            -e KS_B64 -e KS_PASS -e KS_ALIAS \
            -v "$GITHUB_WORKSPACE:/home/user/okular-src" \
            -v "$BASE/craft:/home/user/CraftRoot" \
            -v "$BASE/out:/home/user/out" \
            -v "$BASE/build.sh:/home/user/build.sh:ro" \
            -w /home/user \
            "$IMAGE" \
            bash /home/user/build.sh 2>&1 | tee "$BASE/out/build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armeabi-v7a
          path: /home/runner/okular-android/out/okular-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armv7-logs
          path: |
            /home/runner/okular-android/out/build.log
            /home/runner/okular-android/out/logs
          if-no-files-found: ignore
