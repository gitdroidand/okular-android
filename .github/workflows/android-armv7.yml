name: Okular Android ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Okular Android - armeabi-v7a
    runs-on: ubuntu-24.04

    env:
      CRAFT_ROOT: ${{ github.workspace }}/CraftRoot
      KDE_ANDROID_IMAGE: invent-registry.kde.org/sysadmin/ci-images/android-qt611:latest

    steps:
      - name: Checkout Okular
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          df -h

      - name: Install host dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            ca-certificates \
            build-essential \
            ninja-build \
            cmake \
            pkg-config

      - name: Pull KDE Android build image
        run: |
          docker pull "$KDE_ANDROID_IMAGE"

      - name: Prepare Craft directory
        run: |
          rm -rf "$CRAFT_ROOT"
          mkdir -p "$CRAFT_ROOT"

          # The KDE container normally runs as an unprivileged user.
          # Make the mounted workspace writable inside the container.
          sudo chmod -R a+rwx "$GITHUB_WORKSPACE"

      - name: Bootstrap Craft for Android ARM32
        run: |
          docker run --rm \
            --user 0:0 \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -lc '
              set -euxo pipefail

              export HOME=/root
              export CRAFT_ROOT=/workspace/CraftRoot

              echo "=== Android SDK ==="
              echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
              echo "ANDROID_HOME=${ANDROID_HOME:-}"

              if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
                export ANDROID_SDK_ROOT="$ANDROID_HOME"
              fi

              if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
                if [ -d /opt/android-sdk ]; then
                  export ANDROID_SDK_ROOT=/opt/android-sdk
                elif [ -d /opt/android ]; then
                  export ANDROID_SDK_ROOT=/opt/android
                fi
              fi

              export ANDROID_HOME="$ANDROID_SDK_ROOT"

              echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

              test -n "$ANDROID_SDK_ROOT"
              test -d "$ANDROID_SDK_ROOT"

              echo
              echo "=== Android NDK ==="

              if [ -z "${ANDROID_NDK:-}" ]; then
                ANDROID_NDK="$(find /opt \
                  -maxdepth 6 \
                  -type d \
                  \( -name 'android-ndk-*' -o -name 'ndk-*' \) \
                  2>/dev/null | sort -V | tail -1 || true)"
              fi

              export ANDROID_NDK

              echo "ANDROID_NDK=$ANDROID_NDK"

              test -n "$ANDROID_NDK"
              test -d "$ANDROID_NDK"

              echo
              echo "=== Bootstrap Craft ==="

              curl -fsSL \
                https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py \
                -o /tmp/CraftBootstrap.py

              python3 /tmp/CraftBootstrap.py \
                --prefix "$CRAFT_ROOT" \
                --use-defaults

              echo
              echo "=== Craft settings before ARM32 override ==="

              cat "$CRAFT_ROOT/etc/CraftSettings.ini"

              echo
              echo "=== Force Android ARM32 / armeabi-v7a ==="

              sed -i \
                "s|^[[:space:]]*ABI[[:space:]]*=.*|ABI = android-clang-arm32|" \
                "$CRAFT_ROOT/etc/CraftSettings.ini"

              grep -n "^ABI" \
                "$CRAFT_ROOT/etc/CraftSettings.ini"

              test "$(grep -E "^ABI[[:space:]]*=" "$CRAFT_ROOT/etc/CraftSettings.ini" | head -1 | sed "s/.*=[[:space:]]*//")" = "android-clang-arm32"

              echo
              echo "=== Final Craft settings ==="

              cat "$CRAFT_ROOT/etc/CraftSettings.ini"
            '

      - name: Verify Android ARM32 toolchain
        run: |
          docker run --rm \
            --user 0:0 \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -lc '
              set -euxo pipefail

              export HOME=/root
              export CRAFT_ROOT=/workspace/CraftRoot

              if [ -f "$CRAFT_ROOT/craftenv.sh" ]; then
                source "$CRAFT_ROOT/craftenv.sh"
              fi

              echo "=== ABI ==="
              grep -E "^ABI[[:space:]]*=" \
                "$CRAFT_ROOT/etc/CraftSettings.ini"

              echo
              echo "=== Craft ==="
              "$CRAFT_ROOT/bin/craft" --version

              echo
              echo "=== Android environment ==="
              echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
              echo "ANDROID_NDK=${ANDROID_NDK:-}"

              echo
              echo "=== ARM32 compiler candidates ==="

              find "${ANDROID_NDK:-/nonexistent}" \
                -type f \
                \( \
                  -name "armv7a-linux-androideabi*-clang" \
                  -o -name "arm-linux-androideabi-gcc" \
                \) \
                2>/dev/null | head -20 || true
            '

      - name: Build Okular
        run: |
          docker run --rm \
            --user 0:0 \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -lc '
              set -euxo pipefail

              export HOME=/root
              export CRAFT_ROOT=/workspace/CraftRoot

              source "$CRAFT_ROOT/craftenv.sh"

              echo "========================================"
              echo " Craft ABI"
              echo "========================================"

              grep -E "^ABI[[:space:]]*=" \
                "$CRAFT_ROOT/etc/CraftSettings.ini"

              echo
              echo "========================================"
              echo " Building Okular"
              echo "========================================"

              craft \
                --no-cache \
                --options "[CodeSigning]Enabled=False" \
                --options "okular.srcDir=/workspace" \
                okular
            '

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK/AAB files ==="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
            \) \
            -print

      - name: Verify APK ABI
        if: success()
        run: |
          set -eux

          APK="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            | head -1)"

          test -n "$APK"
          test -f "$APK"

          echo "APK: $APK"

          sudo apt-get update
          sudo apt-get install -y unzip

          rm -rf /tmp/okular-apk-check
          mkdir -p /tmp/okular-apk-check

          unzip -l "$APK" | tee /tmp/okular-apk-list.txt

          if ! grep -q "lib/armeabi-v7a/" /tmp/okular-apk-list.txt; then
            echo "::error::APK does not contain armeabi-v7a native libraries."
            exit 1
          fi

          echo
          echo "========================================"
          echo " armeabi-v7a confirmed"
          echo "========================================"

      - name: Collect APK
        if: success()
        run: |
          rm -rf artifacts
          mkdir -p artifacts/apk

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -exec cp {} artifacts/apk/ \;

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -exec cp {} artifacts/apk/ \;

          ls -lah artifacts/apk

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p artifacts/logs

          find "$GITHUB_WORKSPACE" \
            -type f \
            -path "*/logs/*" \
            -exec cp --parents {} artifacts/logs/ \; \
            || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armeabi-v7a
          path: artifacts/apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armv7-logs
          path: artifacts/logs
          if-no-files-found: ignore
