name: Okular Android ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Okular Android - armeabi-v7a
    runs-on: ubuntu-24.04

    env:
      CRAFT_ROOT: ${{ github.workspace }}/CraftRoot
      CRAFTMASTER_ROOT: ${{ github.workspace }}/craftmaster
      CRAFT_BLUEPRINTS_ROOT: ${{ github.workspace }}/craft-blueprints-kde
      CRAFT_PLATFORM: android-clang-arm32

    steps:
      - name: Checkout Okular
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          df -h

      - name: Install host dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            build-essential \
            ninja-build \
            cmake \
            pkg-config

      # KDE's Android build environment expects a 64-bit Linux host.
      # The actual target is ARM32 / armeabi-v7a.
      - name: Prepare KDE Android Craft environment
        run: |
          mkdir -p "$CRAFT_ROOT"

          docker pull \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611

      - name: Initialize Craft
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              export HOME=/home/user
              export CRAFT_ROOT=/workspace/CraftRoot

              mkdir -p "$CRAFT_ROOT"

              python3 -c "$(curl -fsSL https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py)" \
                --prefix "$CRAFT_ROOT" \
                --use-defaults
            '

      - name: Configure Craft for ARM32
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              export HOME=/home/user
              export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/android-sdk}"
              export ANDROID_HOME="$ANDROID_SDK_ROOT"

              find /opt -maxdepth 4 -type d -name "android-ndk*" 2>/dev/null | head -20 || true

              if [ -z "${ANDROID_NDK:-}" ]; then
                ANDROID_NDK="$(find /opt -maxdepth 5 -type d -name "android-ndk*" 2>/dev/null | head -1 || true)"
                export ANDROID_NDK
              fi

              echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
              echo "ANDROID_NDK=$ANDROID_NDK"

              test -n "$ANDROID_NDK"
              test -d "$ANDROID_NDK"

              rm -rf /workspace/CraftRoot

              python3 -c "$(curl -fsSL https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py)" \
                --prefix /workspace/CraftRoot \
                --dry-run /tmp/CraftSettings.ini

              cat /tmp/CraftSettings.ini
            '

      - name: Setup Craft ARM32
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              export HOME=/home/user
              export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/android-sdk}"
              export ANDROID_HOME="$ANDROID_SDK_ROOT"

              if [ -z "${ANDROID_NDK:-}" ]; then
                ANDROID_NDK="$(find /opt -maxdepth 5 -type d -name "android-ndk*" 2>/dev/null | head -1 || true)"
                export ANDROID_NDK
              fi

              test -n "$ANDROID_NDK"

              rm -rf /workspace/CraftRoot

              printf "arm32\n" | \
              python3 -c "$(curl -fsSL https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py)" \
                --prefix /workspace/CraftRoot
            '

      - name: Clone CraftMaster
        run: |
          rm -rf "$CRAFTMASTER_ROOT"

          git clone \
            --depth=1 \
            https://invent.kde.org/packaging/craftmaster.git \
            "$CRAFTMASTER_ROOT"

      - name: Clone KDE Craft blueprints
        run: |
          rm -rf "$CRAFT_BLUEPRINTS_ROOT"

          git clone \
            --depth=1 \
            https://invent.kde.org/packaging/craft-blueprints-kde.git \
            "$CRAFT_BLUEPRINTS_ROOT"

      - name: Show Craft configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              echo "=== CraftMaster ==="
              python3 /workspace/craftmaster/CraftMaster.py --version

              echo
              echo "=== CraftRoot ==="
              find /workspace/CraftRoot -maxdepth 2 -type f \
                \( -name "CraftSettings.ini" -o -name "BlueprintSettings.ini" \) \
                -print

              echo
              echo "=== Target ==="
              echo "android-clang-arm32"
            '

      - name: Setup CraftMaster
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              python3 \
                /workspace/craftmaster/CraftMaster.py \
                --config /workspace/craft-ci-config.ini \
                --target android-clang-arm32 \
                --setup
            '

      - name: Build Okular dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              python3 \
                /workspace/craftmaster/CraftMaster.py \
                --config /workspace/craft-ci-config.ini \
                --target android-clang-arm32 \
                -c \
                --install-deps \
                --options "[CodeSigning]Enabled=False" \
                okular
            '

      - name: Build Okular
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            invent-registry.kde.org/sysadmin/ci-images/android-qt611 \
            bash -lc '
              set -eux

              python3 \
                /workspace/craftmaster/CraftMaster.py \
                --config /workspace/craft-ci-config.ini \
                --target android-clang-arm32 \
                -c \
                --no-cache \
                --options "[CodeSigning]Enabled=False" \
                --options "okular.srcDir=/workspace" \
                okular
            '

      - name: Locate APK
        if: always()
        run: |
          echo "Searching for APK files..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
            \) \
            -print

      - name: Collect Craft logs
        if: always()
        run: |
          mkdir -p artifacts/logs

          find "$GITHUB_WORKSPACE" \
            -type f \
            -path "*/logs/*" \
            -exec cp --parents {} artifacts/logs/ \; \
            || true

      - name: Collect APK
        if: success()
        run: |
          mkdir -p artifacts/apk

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -exec cp {} artifacts/apk/ \;

          find artifacts/apk \
            -type f \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armeabi-v7a
          path: artifacts/apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armv7-logs
          path: artifacts/logs
          if-no-files-found: ignore
