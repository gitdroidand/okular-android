name: Okular Android ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Okular Android - armeabi-v7a
    runs-on: ubuntu-24.04

    env:
      CRAFT_ROOT: ${{ github.workspace }}/CraftRoot
      KDE_ANDROID_IMAGE: invent-registry.kde.org/sysadmin/ci-images/android-qt611:latest

    steps:
      - name: Checkout Okular
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          df -h

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            ca-certificates \
            build-essential \
            ninja-build \
            cmake \
            pkg-config

      - name: Pull KDE Android build image
        run: |
          docker pull "$KDE_ANDROID_IMAGE"

      - name: Prepare Craft directory
        run: |
          rm -rf "$CRAFT_ROOT"
          mkdir -p "$CRAFT_ROOT"
          sudo chmod -R a+rwx "$GITHUB_WORKSPACE"

      - name: Bootstrap Craft for Android ARM32
        run: |
          docker run --rm \
            --user 0:0 \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -lc '
              set -eo pipefail

              export HOME=/root
              export CRAFT_ROOT=/workspace/CraftRoot

              echo "========================================"
              echo " Android environment"
              echo "========================================"

              if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
                export ANDROID_SDK_ROOT="$ANDROID_HOME"
              fi

              if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
                if [ -d /opt/android-sdk ]; then
                  export ANDROID_SDK_ROOT=/opt/android-sdk
                elif [ -d /opt/android ]; then
                  export ANDROID_SDK_ROOT=/opt/android
                fi
              fi

              export ANDROID_HOME="$ANDROID_SDK_ROOT"

              echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
              echo "ANDROID_HOME=$ANDROID_HOME"

              test -n "$ANDROID_SDK_ROOT"
              test -d "$ANDROID_SDK_ROOT"

              echo
              echo "========================================"
              echo " Android NDK"
              echo "========================================"

              if [ -z "${ANDROID_NDK:-}" ]; then
                ANDROID_NDK="$(
                  find /opt \
                    -maxdepth 7 \
                    -type d \
                    \( \
                      -name "android-ndk-*" \
                      -o \
                      -name "ndk-*" \
                    \) \
                    2>/dev/null \
                    | sort -V \
                    | tail -1 \
                    || true
                )"
              fi

              export ANDROID_NDK

              echo "ANDROID_NDK=$ANDROID_NDK"

              test -n "$ANDROID_NDK"
              test -d "$ANDROID_NDK"

              echo
              echo "========================================"
              echo " Python"
              echo "========================================"

              python3 --version
              command -v python3

              echo
              echo "========================================"
              echo " Craft Bootstrap"
              echo "========================================"

              curl -fsSL \
                https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py \
                -o /tmp/CraftBootstrap.py

              python3 /tmp/CraftBootstrap.py \
                --prefix "$CRAFT_ROOT" \
                --use-defaults

              echo
              echo "========================================"
              echo " Craft installation"
              echo "========================================"

              test -f "$CRAFT_ROOT/craft/bin/craft.py"
              test -f "$CRAFT_ROOT/craft/craftenv.sh"
              test -f "$CRAFT_ROOT/etc/CraftSettings.ini"

              echo "Craft executable:"
              ls -l "$CRAFT_ROOT/craft/bin/craft.py"

              echo
              echo "Craft environment:"
              ls -l "$CRAFT_ROOT/craft/craftenv.sh"

              echo
              echo "========================================"
              echo " Force Android ARM32"
              echo "========================================"

              SETTINGS="$CRAFT_ROOT/etc/CraftSettings.ini"

              grep -E "^[[:space:]]*ABI[[:space:]]*=" "$SETTINGS" || true

              sed -i \
                "s|^[[:space:]]*ABI[[:space:]]*=.*|ABI = android-clang-arm32|" \
                "$SETTINGS"

              echo
              echo "Final ABI:"
              grep -E "^[[:space:]]*ABI[[:space:]]*=" "$SETTINGS"

              test "$(
                grep -E "^[[:space:]]*ABI[[:space:]]*=" "$SETTINGS" \
                | head -1 \
                | sed "s/.*=[[:space:]]*//"
              )" = "android-clang-arm32"

              echo
              echo "========================================"
              echo " Craft settings"
              echo "========================================"

              cat "$SETTINGS"

              echo
              echo "========================================"
              echo " Bootstrap completed"
              echo "========================================"
            '

      - name: Verify Craft and ARM32 environment
        run: |
          docker run --rm \
            --user 0:0 \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -lc '
              set -eo pipefail

              export HOME=/root
              export CRAFT_ROOT=/workspace/CraftRoot

              echo "========================================"
              echo " Prepare Craft environment"
              echo "========================================"

              test -f "$CRAFT_ROOT/craft/craftenv.sh"

              # IMPORTANT:
              # craftenv.sh must be sourced WITHOUT "set -u".
              #
              # The current KDE Craft environment script checks
              # CRAFT_PYTHON_BIN before defining it. With "set -u"
              # that produces:
              #
              # CRAFT_PYTHON_BIN: unbound variable
              #
              # Therefore errexit/pipefail stay enabled, but nounset
              # is intentionally disabled while sourcing Craft.

              set +u
              source "$CRAFT_ROOT/craft/craftenv.sh"
              set -u

              echo
              echo "========================================"
              echo " Craft environment loaded"
              echo "========================================"

              echo "craftRoot=$craftRoot"
              echo "CRAFT_PYTHON_BIN=$CRAFT_PYTHON_BIN"
              echo "KDEROOT=$KDEROOT"

              echo
              echo "========================================"
              echo " Craft ABI"
              echo "========================================"

              grep -E "^[[:space:]]*ABI[[:space:]]*=" \
                "$CRAFT_ROOT/etc/CraftSettings.ini"

              test "$(
                grep -E "^[[:space:]]*ABI[[:space:]]*=" \
                  "$CRAFT_ROOT/etc/CraftSettings.ini" \
                  | head -1 \
                  | sed "s/.*=[[:space:]]*//"
              )" = "android-clang-arm32"

              echo
              echo "========================================"
              echo " Craft version"
              echo "========================================"

              command -v craft
              craft --version

              echo
              echo "========================================"
              echo " Android SDK / NDK"
              echo "========================================"

              echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
              echo "ANDROID_HOME=$ANDROID_HOME"
              echo "ANDROID_NDK=$ANDROID_NDK"

              test -d "$ANDROID_SDK_ROOT"
              test -d "$ANDROID_NDK"

              echo
              echo "========================================"
              echo " ARM32 compiler"
              echo "========================================"

              ARM32_CLANG="$(
                find "$ANDROID_NDK" \
                  -type f \
                  -name "armv7a-linux-androideabi*-clang" \
                  | head -1
              )"

              test -n "$ARM32_CLANG"
              test -x "$ARM32_CLANG"

              echo "ARM32 clang:"
              echo "$ARM32_CLANG"

              "$ARM32_CLANG" --version

              echo
              echo "========================================"
              echo " Craft ARM32 verification passed"
              echo "========================================"
            '

      - name: Build Okular
        run: |
          docker run --rm \
            --user 0:0 \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -lc '
              set -eo pipefail

              export HOME=/root
              export CRAFT_ROOT=/workspace/CraftRoot

              echo "========================================"
              echo " Load Craft"
              echo "========================================"

              # Do NOT use "set -u" here.
              set +u
              source "$CRAFT_ROOT/craft/craftenv.sh"
              set -u

              echo
              echo "========================================"
              echo " Verify ABI"
              echo "========================================"

              SETTINGS="$CRAFT_ROOT/etc/CraftSettings.ini"

              ABI="$(
                grep -E "^[[:space:]]*ABI[[:space:]]*=" "$SETTINGS" \
                | head -1 \
                | sed "s/.*=[[:space:]]*//"
              )"

              echo "ABI=$ABI"

              test "$ABI" = "android-clang-arm32"

              echo
              echo "========================================"
              echo " Craft"
              echo "========================================"

              command -v craft
              craft --version

              echo
              echo "========================================"
              echo " Search Okular blueprint"
              echo "========================================"

              craft --search okular

              echo
              echo "========================================"
              echo " Build Okular"
              echo "========================================"

              craft \
                --options "okular.srcDir=/workspace" \
                okular

              echo
              echo "========================================"
              echo " Package Okular APK"
              echo "========================================"

              craft --package okular

              echo
              echo "========================================"
              echo " Craft build/package completed"
              echo "========================================"
            '

      - name: Locate APK
        if: always()
        run: |
          echo "========================================"
          echo " APK / AAB files"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print

      - name: Verify APK ABI
        if: success()
        run: |
          set -euo pipefail

          APK="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.apk" \
              | head -1
          )"

          test -n "$APK"
          test -f "$APK"

          echo "APK=$APK"

          echo
          echo "========================================"
          echo " APK contents"
          echo "========================================"

          unzip -l "$APK" \
            | tee /tmp/okular-apk-list.txt

          echo
          echo "========================================"
          echo " Verify armeabi-v7a"
          echo "========================================"

          if ! grep -q "lib/armeabi-v7a/" \
            /tmp/okular-apk-list.txt; then

            echo "::error::APK does not contain lib/armeabi-v7a/"

            exit 1
          fi

          echo "armeabi-v7a native libraries found."

      - name: Collect APK
        if: success()
        run: |
          rm -rf artifacts
          mkdir -p artifacts/apk

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -exec cp {} artifacts/apk/ \;

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -exec cp {} artifacts/apk/ \;

          echo "========================================"
          echo " Collected artifacts"
          echo "========================================"

          ls -lah artifacts/apk

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p artifacts/logs

          find "$GITHUB_WORKSPACE" \
            -type f \
            -path "*/logs/*" \
            -exec cp --parents {} artifacts/logs/ \; \
            || true

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.log" \
              -o \
              -name "CMakeError.log" \
              -o \
              -name "CMakeOutput.log" \
            \) \
            -exec cp --parents {} artifacts/logs/ \; \
            || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armeabi-v7a
          path: artifacts/apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okular-android-armv7-logs
          path: artifacts/logs
          if-no-files-found: ignore
